name: Local simulated laboratory tests
on:
  push:
    branches: [develop/mvp-v0.2, codex/mvp-v0.2.1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    env:
      EVIDENCE_ROOT: runtime/evidence/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/python${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked dependencies
        id: dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify exact test inventory and source stability
        if: steps.dependencies.outcome == 'success'
        run: python scripts/verify.py --output-dir "$EVIDENCE_ROOT/verification"
      - name: Demonstrate isolated loopback behavior
        if: always() && steps.dependencies.outcome == 'success'
        run: python scripts/demo.py --output-dir "$EVIDENCE_ROOT/demo"
      - name: Hash measured evidence
        if: always()
        run: |
          mkdir -p "$EVIDENCE_ROOT"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['EVIDENCE_ROOT'])
          files = {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in sorted(root.rglob('*')) if p.is_file()}
          (root / 'artifact-checksums.json').write_text(json.dumps(files, indent=2) + '\n')
          PY
      - name: Upload evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-python${{ matrix.python-version }}
          path: runtime/evidence/
          if-no-files-found: error
          retention-days: 30
